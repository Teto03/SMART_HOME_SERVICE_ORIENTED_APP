<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome IoT Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status-online {
            color: green;
            font-weight: bold;
        }

        .status-offline {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">SmartHome IoT Dashboard</h1>

        <div class="row">
            <!-- System Status -->
            <div class="col-md-12 mb-3 text-center">
                <span id="system-status" class="badge bg-secondary">Loading...</span>
            </div>
        </div>

        <div class="row">
            <!-- Indoor Temperature -->
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">Indoor Temperature</div>
                    <div class="card-body">
                        <h2 class="card-title" id="indoor-temp">-- °C</h2>
                        <p class="card-text text-muted" id="last-update">Last update: --</p>
                    </div>
                </div>
            </div>

            <!-- Outdoor Weather -->
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-header">Outdoor Weather</div>
                    <div class="card-body">
                        <h2 class="card-title" id="outdoor-temp">-- °C</h2>
                        <p class="card-text" id="weather-condition">--</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Energy Advice -->
            <div class="col-md-12">
                <div class="card border-info">
                    <div class="card-header bg-info text-white">Energy Advice</div>
                    <div class="card-body">
                        <h5 class="card-title" id="advice-text">Waiting for data...</h5>
                        <div id="action-alert" class="alert alert-warning d-none mt-3">
                            <strong>Action Required!</strong> Please follow the advice above.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Device Control Section -->
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">Device Control</div>
                    <div class="card-body">
                        <div id="device-list" class="row">
                            <!-- Devices will be injected here -->
                            <p class="text-center">Loading devices...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12 text-center">
                <button class="btn btn-primary btn-lg" onclick="refreshAll()">Refresh Data</button>
            </div>
        </div>
    </div>

    <script>
        async function refreshAll() {
            await fetchData();
            await fetchDevices();
        }

        async function fetchDevices() {
            try {
                const response = await fetch('/api/devices');
                const devices = await response.json();
                const listContainer = document.getElementById('device-list');
                listContainer.innerHTML = '';

                devices.forEach(device => {
                    let controls = '';
                    let statusColor = device.status === 'active' ? 'text-success' : 'text-muted';

                    if (device.type === 'window') {
                        const isOpen = device.status === 'OPEN';
                        statusColor = isOpen ? 'text-danger' : 'text-success';
                        controls = `
                            <button class="btn btn-sm btn-danger" onclick="sendCommand('${device.id}', 'OPEN')">Open</button>
                            <button class="btn btn-sm btn-success" onclick="sendCommand('${device.id}', 'CLOSE')">Close</button>
                        `;
                    } else if (device.type === 'heater') {
                        const isOn = device.status === 'ON';
                        statusColor = isOn ? 'text-danger' : 'text-muted';
                        controls = `
                            <button class="btn btn-sm btn-danger" onclick="sendCommand('${device.id}', 'ON')">Turn On</button>
                            <button class="btn btn-sm btn-secondary" onclick="sendCommand('${device.id}', 'OFF')">Turn Off</button>
                        `;
                    }

                    const cardHtml = `
                        <div class="col-md-4 mb-3">
                            <div class="card h-100">
                                <div class="card-body">
                                    <h5 class="card-title">${device.id}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">${device.type}</h6>
                                    <p class="card-text">Status: <span class="${statusColor} fw-bold">${device.status}</span></p>
                                    <div class="d-grid gap-2">
                                        ${controls}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    listContainer.innerHTML += cardHtml;
                });
            } catch (error) {
                console.error('Error fetching devices:', error);
            }
        }

        async function sendCommand(deviceId, command) {
            try {
                const res = await fetch('/api/devices/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_id: deviceId, command: command })
                });
                if (res.ok) {
                    // Refresh list to show new status
                    fetchDevices();
                } else {
                    alert("Failed to send command");
                }
            } catch (e) {
                alert("Error sending command: " + e);
            }
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();

                // Update System Status
                const statusBadge = document.getElementById('system-status');
                statusBadge.textContent = "System: " + data.system_status;
                statusBadge.className = data.system_status === 'online' ? 'badge bg-success' : 'badge bg-danger';

                // Update Indoor
                if (data.data.indoor_temp !== undefined) {
                    document.getElementById('indoor-temp').textContent = data.data.indoor_temp + " °C";
                    const date = new Date(data.data.last_update * 1000);
                    document.getElementById('last-update').textContent = "Last update: " + date.toLocaleTimeString();
                }

                // Update Outdoor
                if (data.data.outdoor_temp !== undefined) {
                    document.getElementById('outdoor-temp').textContent = data.data.outdoor_temp + " °C";
                    document.getElementById('weather-condition').textContent = data.data.weather_condition;
                }

                // Update Advice
                if (data.advice) {
                    document.getElementById('advice-text').textContent = data.advice;
                    const alertBox = document.getElementById('action-alert');
                    if (data.action_required) {
                        alertBox.classList.remove('d-none');
                    } else {
                        alertBox.classList.add('d-none');
                    }
                }

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('system-status').textContent = "Error connecting to server";
                document.getElementById('system-status').className = 'badge bg-danger';
            }
        }

        // Auto-refresh every 5 seconds
        setInterval(refreshAll, 5000);
        // Initial fetch
        refreshAll();
    </script>
</body>

</html>
